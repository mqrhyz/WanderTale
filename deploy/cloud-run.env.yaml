# --- LLM provider ---
LLM_PROVIDER: "mistral"
MISTRAL_MODEL: "mistral-small-latest"

TRIP_STAGED_GENERATION: "true"
TRIP_PLACES_PHOTOS_ENABLED: "true"
TRIP_DDG_IMAGES_ENABLED: "true"
TRIP_DDG_IMAGES_CONCURRENCY: "6"
TRIP_OTA_HARD_DEADLINE_MS: "45000"
TRIP_OTA_SITES: "agoda,vntrip"
HOTEL_AGENT_MAX_OFFERS_PER_SITE: "2"

# --- Marketplace payments / payout / media moderation ---
# PAYMENT_SIMULATION_MODE=false => dùng PayOS thật trên production.
# 3 key PayOS lấy từ Secret Manager (xem cloudbuild.yaml --update-secrets).
PAYMENT_SIMULATION_MODE: "false"
DEFAULT_PLATFORM_COMMISSION_RATE: "10"
PAYOUT_AUTO_PROCESS: "false"
BUSINESS_MEDIA_MODERATION_REQUIRED: "false"
PAYOS_API_BASE: "https://api-merchant.payos.vn"
PAYOS_RETURN_URL: "https://wandertale.app/payment/success"
PAYOS_CANCEL_URL: "https://wandertale.app/payment/cancel"
