substitutions:
  _REGION: asia-southeast1
  _SERVICE: wander-tale-api
  _REPOSITORY: wander-tale
  _IMAGE: wander-tale-api

steps:
  - id: Build container
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - backend/Dockerfile
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA
      - .

  - id: Push container
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA

  - id: Deploy Cloud Run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --service-account
      - wander-tale-runtime@$PROJECT_ID.iam.gserviceaccount.com
      - --allow-unauthenticated
      - --port
      - "8000"
      - --memory
      - 2Gi
      - --cpu
      - "1"
      - --no-cpu-throttling
      - --timeout
      - "300"
      - --concurrency
      - "2"
      - --max-instances
      - "2"
      - --env-vars-file
      - deploy/cloud-run.env.yaml
      - --update-secrets
      - SUPABASE_URL=wander-tale-supabase-url:latest,SUPABASE_SERVICE_ROLE_KEY=wander-tale-supabase-service-role-key:latest,GEMINI_API_KEY_1=wander-tale-gemini-api-key:latest,OPENWEATHER_API_KEY=wander-tale-openweather-api-key:latest,VIETMAP_API_KEY=wander-tale-vietmap-api-key:latest,PEXELS_API_KEY=wander-tale-pexels-api-key:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
